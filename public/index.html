<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CharBuild — character builder after McKee</title>
  <meta name="description" content="A structured, visual character builder grounded in Robert McKee's CHARACTER, with an optional Claude-powered coach.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23e4572e' stroke-width='2.4' opacity='.4'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e4572e' stroke-width='2.4' opacity='.7'/%3E%3Cpath d='M16 2v28' stroke='%23e4572e' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e4572e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,750&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app"><p style="padding:40px;font-family:system-ui" id="boot-msg">Loading CharBuild…</p></div>
  <script>
    // Match the loading screen to the language the app will open in.
    try {
      // …and to the chosen theme, so the page doesn't flash another one.
      var th = localStorage.getItem('charbuild-theme');
      if (th === 'light' || th === 'dark' || th === 'terminal') document.documentElement.dataset.theme = th;
      var l = localStorage.getItem('charbuild-lang') || (navigator.languages || [navigator.language]).join(',');
      if (/^it/i.test(l)) { document.documentElement.lang = 'it'; document.getElementById('boot-msg').textContent = 'Caricamento di CharBuild…'; }
    } catch (e) { /* storage unavailable */ }
  </script>
  <noscript>CharBuild needs JavaScript. · CharBuild richiede JavaScript.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
